slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /g5/scan
    resolution: 0.025
    max_laser_range: 8.0
    minimum_time_interval: 0.2
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.15
    transform_publish_period: 0.05
    map_update_interval: 2.0
